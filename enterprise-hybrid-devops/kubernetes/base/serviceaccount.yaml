# One ServiceAccount per workload. The IRSA annotation ties the pod identity to
# an IAM role whose trust policy only accepts this exact
# namespace/service-account pair. That role is the ONLY identity the pod has:
# it can read its own secrets and write to its own S3 prefix, nothing else.
#
# Trust policy created by the platform (documented in docs/OPERATIONS.md):
#   Federated principal: arn:aws:iam::<account>:oidc-provider/oidc.eks.<region>.amazonaws.com/id/<ID>
#   Condition StringEquals:
#     <issuer>:sub  = "system:serviceaccount:ehd-apps:order-service"
#     <issuer>:aud  = "sts.amazonaws.com"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: ehd-apps
  labels:
    app.kubernetes.io/name: order-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::444455556666:role/ehd-prod-order-service
automountServiceAccountToken: true # required for IRSA
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: ehd-apps
  labels:
    app.kubernetes.io/name: notification-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::444455556666:role/ehd-prod-notification-service
automountServiceAccountToken: true
---
# Kafka consumers only get Kafka credentials. They do not read the database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-consumer
  namespace: ehd-apps
  labels:
    app.kubernetes.io/name: kafka-consumer
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::444455556666:role/ehd-prod-kafka-consumer
automountServiceAccountToken: true
