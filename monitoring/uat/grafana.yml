# Grafana for UAT only. The admin password is NOT in this file: it is synced
# from Secrets Manager into the Kubernetes Secret referenced below.
# Dashboards are provisioned from a ConfigMap so they are version controlled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  # Keep the dashboard JSON small or reference it from a bucket; the point is
  # that dashboards are code, not clicks in a UI.
  ehd-overview.json: |
    {
      "title": "EHD UAT Overview",
      "panels": [
        {"type": "timeseries", "title": "Pod CPU (ehd-apps)", "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"ehd-apps\"}[5m])) by (pod)"}]},
        {"type": "timeseries", "title": "JVM heap used %", "targets": [{"expr": "100 * sum(jvm_memory_used_bytes{area=\"heap\"}) by (pod) / sum(jvm_memory_max_bytes{area=\"heap\"}) by (pod)"}]},
        {"type": "timeseries", "title": "ALB 5xx", "targets": [{"expr": "sum(aws_applicationelb_httpcode_target_5_xx_count_sum)"}]}
      ],
      "schemaVersion": 39,
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: { app.kubernetes.io/name: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: dashboards, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: ClusterIP # reach it with: kubectl -n monitoring port-forward svc/grafana 3000:3000
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - port: 3000
      targetPort: 3000
