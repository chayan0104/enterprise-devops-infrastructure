# ClusterIP only: microservices are called by the WildFly app and by other
# services inside the cluster. Nothing is exposed to the internet here.
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ehd-apps
  labels:
    app.kubernetes.io/name: order-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
