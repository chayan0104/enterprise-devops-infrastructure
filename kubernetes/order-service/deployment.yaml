apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ehd-apps
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: enterprise-hybrid-devops
    app.kubernetes.io/version: "0.0.0" # pipeline patches this label with the release tag
spec:
  # Two replicas minimum: one node or one AZ can be lost without downtime.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the desired replica count
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: enterprise-hybrid-devops
    spec:
      serviceAccountName: order-service
      # Never allow the pod to be killed instantly: in-flight requests must finish.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes and AZs where possible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      containers:
        - name: order-service
          # Image tag is replaced by the pipeline with an immutable
          # release-<git-sha> tag via `kubectl set image`. Never use :latest.
          image: 444455556666.dkr.ecr.eu-west-1.amazonaws.com/ehd-prod/order-service:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: ehd-microservices-config
          env:
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-service-secrets
                  key: db-credentials.json
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # Startup probe covers slow JVM/Spring startup; liveness only starts
          # after the app is up, so a slow boot is not treated as a crash.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            failureThreshold: 30 # up to 5 minutes
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the endpoint be removed from Service/ALB before shutdown.
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: order-service-secrets
        - name: tmp
          emptyDir: {}
