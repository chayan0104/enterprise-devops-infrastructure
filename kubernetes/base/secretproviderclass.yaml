# Secrets Store CSI Driver + AWS Secrets Manager provider.
# The CSI driver (platform prerequisite) fetches these objects at pod start and
# mounts them inside the container. Values never live in Git or in a ConfigMap.
#
# Order of operations:
#   1. kubelet calls the CSI driver with this class + this ServiceAccount
#   2. the driver uses the pod's IRSA role to call secretsmanager:GetSecretValue
#   3. the objects are mounted at /mnt/secrets-store
#   4. secretObjects below also syncs them into a normal Kubernetes Secret so
#      Spring Boot can use env vars (valueFrom.secretKeyRef)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: order-service-secrets
  namespace: ehd-apps
spec:
  provider: aws
  parameters:
    usePodIdentity: "false"
    useFederatedWorkloadIdentityExtension: "true"
    region: eu-west-1
    objects: |
      - objectName: "ehd/prod/db"
        objectType: secretsmanager
        objectAlias: db-credentials
      - objectName: "ehd/prod/sftp"
        objectType: secretsmanager
        objectAlias: sftp-credentials
  # Optional: also materialize a Kubernetes Secret for env var injection.
  # It is re-synced when the pod restarts, so keep credentials cache TTL short
  # or have Spring Cloud AWS re-read the secret on rotation.
  secretObjects:
    - secretName: order-service-secrets
      type: Opaque
      data:
        - objectName: db-credentials
          key: db-credentials.json
        - objectName: sftp-credentials
          key: sftp-credentials.json
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kafka-consumer-secrets
  namespace: ehd-apps
spec:
  provider: aws
  parameters:
    usePodIdentity: "false"
    useFederatedWorkloadIdentityExtension: "true"
    region: eu-west-1
    objects: |
      - objectName: "ehd/prod/kafka"
        objectType: secretsmanager
        objectAlias: kafka-credentials
  secretObjects:
    - secretName: kafka-consumer-secrets
      type: Opaque
      data:
        - objectName: kafka-credentials
          key: kafka-credentials.json
